build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "git"
  python_packages:
    - "torch==2.4.1"
    - "torchaudio==2.4.1"
    - "transformers>=4.44.0"
    - "accelerate>=0.33.0"
    - "flash-attn>=2.6.3"
    - "scipy"
    - "soundfile"
    - "numpy"
    - "safetensors"
    - "huggingface_hub"
  run:
    # Clone the official HeartMuLa repository and install it
    - "git clone https://github.com/HeartMuLa/heartlib.git /src/heartlib"
    - "cd /src/heartlib && pip install -e ."
    # Pre-download weights into the image to prevent cold-boot latency
    - "python script/download_weights.py"

predict: "predict.py:Predictor"
