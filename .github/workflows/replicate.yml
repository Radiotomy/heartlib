name: Push to Replicate

# Trigger the workflow when changes are pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    # We use an Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Free up ~30GB of disk space on the runner
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. Check out the code from your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Download the model weights before Cog builds the container
      - name: Download model weights
        run: |
          pip install huggingface_hub
          hf download 'HeartMuLa/HeartMuLa-RL-oss-3B-20260123' --local-dir './ckpt/HeartMuLa-oss-3B'
          hf download 'HeartMuLa/HeartCodec-oss-20260123' --local-dir './ckpt/HeartCodec-oss'

      # 4. Set up Cog and authenticate
      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      # 5. Build and push the model to Replicate
      - name: Push to Replicate
        run: cog push r8.im/speedwolf2000/siren-song

      # 6. Verify the new push boots successfully on Replicate
      - name: Boot-health check the pushed version
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MODEL: speedwolf2000/siren-song
        run: |
          set -euo pipefail

          # Resolve the version that was just pushed — never hardcode an id.
          VERSION=$(curl -sf -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            "https://api.replicate.com/v1/models/$MODEL" | jq -r '.latest_version.id')
          echo "Boot-checking version $VERSION"

          # Smallest legal request: shortest audio, trivial conditioning.
          PRED=$(curl -sf -X POST \
            -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VERSION\",\"input\":{\"tags\":\"piano\",\"lyrics\":\"[Instrumental]\",\"max_audio_length_ms\":10000}}" \
            https://api.replicate.com/v1/predictions)
          ID=$(echo "$PRED" | jq -r '.id')
          echo "Prediction $ID created"

          # 15m ceiling covers a cold pull of the multi-GB weights image;
          # a boot crash fails well before that.
          DEADLINE=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            P=$(curl -sf -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
              "https://api.replicate.com/v1/predictions/$ID")
            STATUS=$(echo "$P" | jq -r '.status')
            STARTED=$(echo "$P" | jq -r '.started_at // empty')
            LOGS=$(echo "$P" | jq -r '.logs // ""')

            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::Version $VERSION FAILED TO BOOT"
              echo "$P" | jq -r '.error'
              echo "--- logs ---"
              echo "$LOGS"
              exit 1
            fi

            # setup() got far enough to import deps, load the model and log.
            if [ -n "$STARTED" ] && [ -n "$LOGS" ]; then
              echo "Booted OK — setup() reached logging. Cancelling probe."
              curl -sf -X POST -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
                "https://api.replicate.com/v1/predictions/$ID/cancel" > /dev/null || true
              exit 0
            fi

            # A succeeded run this early is the null-output signature: the
            # entry point returned nothing. Treat it as failure, never a pass.
            if [ "$STATUS" = "succeeded" ]; then
              if [ "$(echo "$P" | jq -r '.output // "null"')" = "null" ]; then
                echo "::error::Version $VERSION returned null output — entry point produced no value"
                exit 1
              fi
              echo "Booted OK (completed)."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Version $VERSION never booted within 15m — cancelling"
          curl -sf -X POST -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            "https://api.replicate.com/v1/predictions/$ID/cancel" > /dev/null || true
          exit 1
